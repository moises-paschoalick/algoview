<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca Binária — Visualizador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 18px 16px 10px;
      border-bottom: 1px solid #1e2130;
    }
    header h1 { font-size: 1.35rem; color: #f8fafc; letter-spacing: -0.01em; }
    header p  { color: #475569; font-size: 0.8rem; margin-top: 3px; }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      background: #10131c;
      border-bottom: 1px solid #1e2130;
      flex-wrap: wrap;
    }

    .divider { width: 1px; height: 22px; background: #1e2130; }

    label { color: #64748b; font-size: 0.82rem; }

    input[type="number"] {
      width: 68px;
      padding: 5px 8px;
      background: #1a1f2e;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
    }
    input[type="number"]:focus { border-color: #6366f1; }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-play     { background: #6366f1; color: #fff; }
    .btn-play:hover:not(:disabled) { background: #4f46e5; }
    .btn-step     { background: #1e2130; color: #94a3b8; border: 1px solid #2d3148; }
    .btn-step:hover:not(:disabled) { background: #252840; }
    .btn-reset    { background: #1e2130; color: #94a3b8; border: 1px solid #2d3148; }
    .btn-reset:hover:not(:disabled) { background: #252840; }
    .btn-new      { background: #0f3460; color: #60a5fa; border: 1px solid #1e4a80; }
    .btn-new:hover { background: #164070; }

    .speed-wrap { display: flex; align-items: center; gap: 7px; }
    input[type="range"] { width: 90px; accent-color: #6366f1; cursor: pointer; }

    /* ── Main layout ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── Viz panel ── */
    .viz-panel {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid #1a1f2e;
      overflow-y: auto;
      gap: 0;
    }

    .panel-label {
      align-self: flex-start;
      font-size: 0.68rem;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 18px;
    }

    /* ── Array ── */
    .array-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .array-row {
      display: flex;
      gap: 7px;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .cell {
      width: 52px;
      height: 52px;
      border-radius: 9px;
      border: 2px solid #252840;
      background: #1a1f2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: #94a3b8;
      position: relative;
      transition: background 0.3s ease, border-color 0.3s ease,
                  color 0.3s ease, opacity 0.3s ease,
                  transform 0.3s ease, box-shadow 0.3s ease;
      flex-shrink: 0;
      user-select: none;
    }

    .cell .idx {
      position: absolute;
      top: -18px;
      font-size: 0.6rem;
      color: #334155;
      font-weight: 400;
    }

    .cell.eliminated {
      opacity: 0.18;
      transform: scale(0.88);
      border-color: #1a1f2e;
    }

    .cell.in-range {
      color: #cbd5e1;
      border-color: #2d3148;
      background: #1e2234;
    }

    .cell.is-mid {
      background: #1c1726;
      border-color: #f59e0b;
      color: #fbbf24;
      box-shadow: 0 0 18px rgba(245,158,11,0.4);
      transform: scale(1.1);
    }

    .cell.is-found {
      background: #052e16;
      border-color: #22c55e;
      color: #4ade80;
      box-shadow: 0 0 24px rgba(34,197,94,0.55);
      transform: scale(1.18);
      animation: pop-found 0.55s cubic-bezier(.36,.07,.19,.97);
    }

    @keyframes pop-found {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.28); }
      65%  { transform: scale(1.08); }
      100% { transform: scale(1.18); }
    }

    /* ── Pointer row ── */
    .pointer-row {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-top: 6px;
      min-height: 26px;
    }

    .ptr-slot {
      width: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .ptr-tag {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1.3;
      letter-spacing: 0.03em;
      transition: opacity 0.3s;
    }
    .ptr-tag.L { background: rgba(99,102,241,0.25); color: #818cf8; }
    .ptr-tag.M { background: rgba(245,158,11,0.25);  color: #fbbf24; }
    .ptr-tag.H { background: rgba(168,85,247,0.25);  color: #c084fc; }

    /* ── Variables strip ── */
    .vars-strip {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 18px;
    }
    .var-chip {
      flex: 1;
      background: #10131c;
      border: 1px solid #1e2130;
      border-radius: 8px;
      padding: 9px 8px;
      text-align: center;
    }
    .var-chip .vn { font-size: 0.62rem; color: #334155; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .var-chip .vv { font-size: 1.15rem; font-weight: 700; }
    .chip-target .vv { color: #34d399; }
    .chip-low    .vv { color: #818cf8; }
    .chip-mid    .vv { color: #fbbf24; }
    .chip-high   .vv { color: #c084fc; }

    /* ── Status box ── */
    .status-box {
      width: 100%;
      margin-top: 14px;
      background: #10131c;
      border: 1px solid #1a1f2e;
      border-radius: 10px;
      padding: 13px 16px;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .status-label { font-size: 0.62rem; color: #334155; text-transform: uppercase; letter-spacing: 0.08em; }
    .status-msg   { font-size: 0.88rem; color: #e2e8f0; line-height: 1.45; }

    /* ── Step bar ── */
    .step-bar-wrap {
      width: 100%;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .step-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #334155;
    }
    .step-track {
      width: 100%;
      height: 4px;
      background: #1a1f2e;
      border-radius: 2px;
      overflow: hidden;
    }
    .step-fill {
      height: 100%;
      background: #6366f1;
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    /* ── Code panel ── */
    .code-panel {
      display: flex;
      flex-direction: column;
      background: #0a0d14;
      overflow: hidden;
    }

    .code-header {
      padding: 12px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a1f2e;
    }
    .code-header .panel-label { margin: 0; }
    .complexity-badge {
      font-size: 0.72rem;
      background: #0f2749;
      border: 1px solid #1e4a80;
      color: #60a5fa;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .code-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0 16px;
    }
    .code-scroll::-webkit-scrollbar { width: 6px; }
    .code-scroll::-webkit-scrollbar-track { background: transparent; }
    .code-scroll::-webkit-scrollbar-thumb { background: #1e2130; border-radius: 3px; }

    .code-line {
      display: flex;
      align-items: center;
      padding: 1px 12px 1px 0;
      position: relative;
      transition: background 0.2s ease;
      min-height: 1.85em;
    }
    .code-line.active {
      background: rgba(245,158,11,0.09);
    }
    .code-line.active::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: #f59e0b;
      border-radius: 0 2px 2px 0;
    }
    .code-line.active .ln { color: #f59e0b; }

    .arrow-col {
      width: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: #f59e0b;
      flex-shrink: 0;
    }

    .ln {
      width: 28px;
      text-align: right;
      font-size: 0.72rem;
      color: #2d3148;
      flex-shrink: 0;
      padding-right: 10px;
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      user-select: none;
      transition: color 0.2s;
    }

    .lc {
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.85;
      white-space: pre;
      color: #cbd5e1;
    }
    .lc.empty { line-height: 1.1; }

    /* ── Syntax colors ── */
    .kw  { color: #c792ea; }
    .fn  { color: #82aaff; }
    .nm  { color: #f78c6c; }
    .op  { color: #89ddff; }
    .vi  { color: #ffcb6b; }
    .cm  { color: #3d5166; font-style: italic; }

    /* ── Result overlay ── */
    .result-overlay {
      width: 100%;
      margin-top: 0;
      padding: 10px 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 600;
      display: none;
    }
    .result-overlay.found-res {
      display: block;
      background: #052e16;
      border: 1px solid #22c55e;
      color: #4ade80;
    }
    .result-overlay.notfound-res {
      display: block;
      background: #1c0a0a;
      border: 1px solid #ef4444;
      color: #f87171;
    }
  </style>
</head>
<body>

<header>
  <h1>Busca Binária</h1>
  <p>Visualizador passo a passo &nbsp;·&nbsp; O(log n)</p>
</header>

<div class="controls">
  <label>Target:</label>
  <input type="number" id="targetInput" value="7" min="-999" max="999" />
  <button class="btn btn-new" id="newArrayBtn">⟳ Novo Array</button>

  <div class="divider"></div>

  <button class="btn btn-play"  id="playBtn">▶ Play</button>
  <button class="btn btn-step"  id="stepBtn">⏭ Step</button>
  <button class="btn btn-reset" id="resetBtn">↺ Reset</button>

  <div class="divider"></div>

  <div class="speed-wrap">
    <label>Velocidade:</label>
    <input type="range" id="speedSlider" min="1" max="10" value="5" />
  </div>
</div>

<div class="main">

  <!-- ═══════ Visualizer Panel ═══════ -->
  <div class="viz-panel">
    <div class="panel-label">Visualização</div>

    <div class="array-section">
      <div class="array-row"   id="arrayRow"></div>
      <div class="pointer-row" id="pointerRow"></div>
    </div>

    <div class="vars-strip">
      <div class="var-chip chip-target">
        <div class="vn">Target</div>
        <div class="vv" id="varTarget">—</div>
      </div>
      <div class="var-chip chip-low">
        <div class="vn">Low</div>
        <div class="vv" id="varLow">—</div>
      </div>
      <div class="var-chip chip-mid">
        <div class="vn">Mid</div>
        <div class="vv" id="varMid">—</div>
      </div>
      <div class="var-chip chip-high">
        <div class="vn">High</div>
        <div class="vv" id="varHigh">—</div>
      </div>
    </div>

    <div class="status-box">
      <div class="status-label">Status</div>
      <div class="status-msg" id="statusMsg">Pronto para iniciar. Pressione Play ou Step.</div>
    </div>

    <div id="resultOverlay" class="result-overlay"></div>

    <div class="step-bar-wrap">
      <div class="step-info">
        <span id="stepLabel">Passo 0 de 0</span>
        <span id="complexityInfo"></span>
      </div>
      <div class="step-track">
        <div class="step-fill" id="stepFill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- ═══════ Code Panel ═══════ -->
  <div class="code-panel">
    <div class="code-header">
      <div class="panel-label">Código — JavaScript</div>
      <span class="complexity-badge">O(log n)</span>
    </div>
    <div class="code-scroll" id="codeScroll">
      <div id="codeBlock"></div>
    </div>
  </div>

</div>

<script>
// ── Code definition ─────────────────────────────────────────────────────────
// Each entry: [lineId, html]  (empty html = blank line)
const CODE = [
  [1,  `<span class="cm">// Busca Binária — array ordenado</span>`],
  [2,  ``],
  [3,  `<span class="kw">function</span> <span class="fn">binarySearch</span>(arr, target) {`],
  [4,  `  <span class="kw">let</span> <span class="vi">low</span>  <span class="op">=</span> <span class="nm">0</span>;`],
  [5,  `  <span class="kw">let</span> <span class="vi">high</span> <span class="op">=</span> arr.length <span class="op">-</span> <span class="nm">1</span>;`],
  [6,  ``],
  [7,  `  <span class="kw">while</span> (<span class="vi">low</span> <span class="op">&lt;=</span> <span class="vi">high</span>) {`],
  [8,  `    <span class="kw">let</span> <span class="vi">mid</span> <span class="op">=</span> Math.<span class="fn">floor</span>((<span class="vi">low</span> <span class="op">+</span> <span class="vi">high</span>) <span class="op">/</span> <span class="nm">2</span>);`],
  [9,  ``],
  [10, `    <span class="kw">if</span> (arr[<span class="vi">mid</span>] <span class="op">===</span> target) {`],
  [11, `      <span class="kw">return</span> <span class="vi">mid</span>;           <span class="cm">// ✓ encontrado</span>`],
  [12, `    } <span class="kw">else if</span> (arr[<span class="vi">mid</span>] <span class="op">&lt;</span> target) {`],
  [13, `      <span class="vi">low</span> <span class="op">=</span> <span class="vi">mid</span> <span class="op">+</span> <span class="nm">1</span>;       <span class="cm">// buscar à direita</span>`],
  [14, `    } <span class="kw">else</span> {`],
  [15, `      <span class="vi">high</span> <span class="op">=</span> <span class="vi">mid</span> <span class="op">-</span> <span class="nm">1</span>;      <span class="cm">// buscar à esquerda</span>`],
  [16, `    }`],
  [17, `  }`],
  [18, ``],
  [19, `  <span class="kw">return</span> <span class="op">-</span><span class="nm">1</span>;               <span class="cm">// ✗ não encontrado</span>`],
  [20, `}`],
];

// ── State ────────────────────────────────────────────────────────────────────
let arr     = [];
let target  = 7;
let steps   = [];
let cursor  = -1;
let playing = false;
let timer   = null;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const arrayRow      = $('arrayRow');
const pointerRow    = $('pointerRow');
const statusMsg     = $('statusMsg');
const resultOverlay = $('resultOverlay');
const stepLabel     = $('stepLabel');
const stepFill      = $('stepFill');
const complexityInfo= $('complexityInfo');
const varTarget     = $('varTarget');
const varLow        = $('varLow');
const varMid        = $('varMid');
const varHigh       = $('varHigh');
const playBtn       = $('playBtn');
const stepBtn       = $('stepBtn');
const resetBtn      = $('resetBtn');
const newArrayBtn   = $('newArrayBtn');
const targetInput   = $('targetInput');
const speedSlider   = $('speedSlider');
const codeBlock     = $('codeBlock');
const codeScroll    = $('codeScroll');

// ── Render code panel ────────────────────────────────────────────────────────
function renderCode() {
  codeBlock.innerHTML = CODE.map(([id, html]) => `
    <div class="code-line" id="cl${id}">
      <span class="arrow-col"></span>
      <span class="ln">${id}</span>
      <span class="lc${html ? '' : ' empty'}">${html}</span>
    </div>
  `).join('');
}

function highlightLine(lineId) {
  document.querySelectorAll('.code-line').forEach(el => {
    el.classList.remove('active');
    el.querySelector('.arrow-col').textContent = '';
  });
  if (!lineId) return;
  const el = $(`cl${lineId}`);
  if (!el) return;
  el.classList.add('active');
  el.querySelector('.arrow-col').textContent = '→';
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ── Array generation ─────────────────────────────────────────────────────────
function generateArray(tgt) {
  const size = 9 + Math.floor(Math.random() * 3); // 9–11 elements
  const pool = new Set();
  while (pool.size < size) pool.add(Math.floor(Math.random() * 90) + 1);
  const sorted = Array.from(pool).sort((a, b) => a - b);
  // Include target ~65% of the time
  if (!sorted.includes(tgt) && Math.random() < 0.65) {
    sorted.push(tgt);
    sorted.sort((a, b) => a - b);
    if (sorted.length > size) sorted.splice(Math.floor(Math.random() * 2), 1);
  }
  return sorted;
}

// ── Step generation ──────────────────────────────────────────────────────────
function generateSteps(a, tgt) {
  const s = [];
  let lo = 0, hi = a.length - 1;

  s.push({ line: 4, lo,  hi,  mid: null, type: 'init-lo',    msg: `Inicializando: low = 0` });
  s.push({ line: 5, lo,  hi,  mid: null, type: 'init-hi',    msg: `Inicializando: high = ${hi} (arr.length - 1)` });

  while (lo <= hi) {
    s.push({ line: 7, lo, hi, mid: null, type: 'while-check',
      msg: `Verificar condição: low(${lo}) ≤ high(${hi}) → verdadeiro, continuar` });

    const mid = Math.floor((lo + hi) / 2);
    s.push({ line: 8, lo, hi, mid, type: 'calc-mid',
      msg: `mid = ⌊(${lo} + ${hi}) / 2⌋ = ${mid}  →  arr[${mid}] = ${a[mid]}` });

    if (a[mid] === tgt) {
      s.push({ line: 10, lo, hi, mid, type: 'check-eq',
        msg: `arr[${mid}] = ${a[mid]} === target(${tgt}) ?  Sim!` });
      s.push({ line: 11, lo, hi, mid, type: 'found',
        msg: `✓ Encontrado! arr[${mid}] = ${tgt}  →  retornando índice ${mid}` });
      return s;
    } else if (a[mid] < tgt) {
      s.push({ line: 12, lo, hi, mid, type: 'check-lt',
        msg: `arr[${mid}] = ${a[mid]} < target(${tgt}) ?  Sim  →  descartar metade esquerda` });
      lo = mid + 1;
      s.push({ line: 13, lo, hi, mid, type: 'update-lo',
        msg: `low = ${mid} + 1 = ${lo}  (eliminar índices 0..${mid})` });
    } else {
      s.push({ line: 12, lo, hi, mid, type: 'check-lt-no',
        msg: `arr[${mid}] = ${a[mid]} < target(${tgt}) ?  Não` });
      s.push({ line: 14, lo, hi, mid, type: 'else',
        msg: `arr[${mid}] = ${a[mid]} > target(${tgt})  →  descartar metade direita` });
      hi = mid - 1;
      s.push({ line: 15, lo, hi, mid, type: 'update-hi',
        msg: `high = ${mid} - 1 = ${hi}  (eliminar índices ${mid}..${a.length - 1})` });
    }
  }

  s.push({ line: 7, lo, hi, mid: null, type: 'while-fail',
    msg: `Verificar condição: low(${lo}) > high(${hi}) → falso, sair do loop` });
  s.push({ line: 19, lo, hi, mid: null, type: 'not-found',
    msg: `✗ Não encontrado no array  →  retornando -1` });
  return s;
}

// ── Build DOM array ───────────────────────────────────────────────────────────
function buildArrayDOM() {
  arrayRow.innerHTML = arr
    .map((v, i) => `<div class="cell" id="cell${i}"><span class="idx">${i}</span>${v}</div>`)
    .join('');
  pointerRow.innerHTML = arr
    .map((_, i) => `<div class="ptr-slot" id="ptr${i}"></div>`)
    .join('');
}

// ── Render a step ─────────────────────────────────────────────────────────────
const MID_TYPES = new Set(['calc-mid','check-eq','check-lt','check-lt-no','else','found']);

function renderStep(idx) {
  if (idx < 0 || idx >= steps.length) return;
  const { line, lo, hi, mid, type, msg } = steps[idx];

  // ── Array cells ──
  arr.forEach((_, i) => {
    const cell = $(`cell${i}`);
    cell.className = 'cell';

    if (type === 'found' && i === mid) {
      cell.classList.add('is-found');
    } else if (type === 'not-found' || type === 'while-fail') {
      cell.classList.add('eliminated');
    } else if (lo !== null && hi !== null) {
      if (i < lo || i > hi) {
        cell.classList.add('eliminated');
      } else if (MID_TYPES.has(type) && mid !== null && i === mid) {
        cell.classList.add('is-mid');
      } else {
        cell.classList.add('in-range');
      }
    }
  });

  // ── Pointer slots ──
  arr.forEach((_, i) => {
    const slot = $(`ptr${i}`);
    slot.innerHTML = '';

    const showMid = MID_TYPES.has(type);
    const tags = [];
    if (i === lo) tags.push('L');
    if (showMid && mid !== null && i === mid) tags.push('M');
    if (i === hi) tags.push('H');

    tags.forEach(t => {
      const span = document.createElement('span');
      span.className = `ptr-tag ${t}`;
      span.textContent = t;
      slot.appendChild(span);
    });
  });

  // ── Variables ──
  varTarget.textContent = target;
  varLow.textContent    = lo  !== null ? lo  : '—';
  varMid.textContent    = (MID_TYPES.has(type) && mid !== null) ? mid : '—';
  varHigh.textContent   = hi  !== null ? hi  : '—';

  // ── Status ──
  statusMsg.textContent = msg;

  // ── Result overlay ──
  resultOverlay.className = 'result-overlay';
  if (type === 'found') {
    resultOverlay.classList.add('found-res');
    resultOverlay.textContent = `✓ Encontrado no índice ${mid}  (valor ${arr[mid]})`;
  } else if (type === 'not-found') {
    resultOverlay.classList.add('notfound-res');
    resultOverlay.textContent = `✗ ${target} não está no array  →  retorno -1`;
  }

  // ── Code highlight ──
  highlightLine(line);

  // ── Step bar ──
  const pct = steps.length > 1 ? ((idx) / (steps.length - 1)) * 100 : 100;
  stepFill.style.width = pct + '%';
  stepLabel.textContent = `Passo ${idx + 1} de ${steps.length}`;

  const iterations = steps.filter(s => s.type === 'calc-mid').length;
  complexityInfo.textContent = iterations > 0 ? `${iterations} iteração${iterations > 1 ? 'ões' : ''}` : '';
}

// ── Controls ──────────────────────────────────────────────────────────────────
function getDelay() {
  return Math.round(1500 / parseInt(speedSlider.value));
}

function updateButtons() {
  const done = cursor >= steps.length - 1;
  playBtn.textContent = playing ? '⏸ Pausar' : '▶ Play';
  playBtn.disabled = done;
  stepBtn.disabled  = done || playing;
}

function resetView() {
  arr.forEach((_, i) => {
    const c = $(`cell${i}`);
    if (c) c.className = 'cell';
    const p = $(`ptr${i}`);
    if (p) p.innerHTML = '';
  });
  varTarget.textContent = target;
  varLow.textContent = varMid.textContent = varHigh.textContent = '—';
  statusMsg.textContent = 'Pronto para iniciar. Pressione Play ou Step.';
  resultOverlay.className = 'result-overlay';
  stepFill.style.width = '0%';
  stepLabel.textContent = `Passo 0 de ${steps.length}`;
  complexityInfo.textContent = '';
  highlightLine(null);
  cursor = -1;
}

function doStep() {
  if (cursor < steps.length - 1) {
    cursor++;
    renderStep(cursor);
    updateButtons();
  }
}

function startPlay() {
  if (cursor >= steps.length - 1) return;
  playing = true;
  updateButtons();

  function tick() {
    if (!playing || cursor >= steps.length - 1) {
      playing = false;
      updateButtons();
      return;
    }
    doStep();
    timer = setTimeout(tick, getDelay());
  }
  timer = setTimeout(tick, getDelay());
}

function pausePlay() {
  playing = false;
  clearTimeout(timer);
  updateButtons();
}

function fullReset() {
  pausePlay();
  resetView();
  updateButtons();
}

function init() {
  target = parseInt(targetInput.value) || 7;
  steps  = generateSteps(arr, target);
  buildArrayDOM();
  resetView();
  updateButtons();
}

// ── Event listeners ───────────────────────────────────────────────────────────
playBtn.addEventListener('click', () => {
  if (playing) pausePlay(); else startPlay();
});

stepBtn.addEventListener('click', () => {
  pausePlay();
  doStep();
});

resetBtn.addEventListener('click', fullReset);

newArrayBtn.addEventListener('click', () => {
  pausePlay();
  target = parseInt(targetInput.value) || 7;
  arr    = generateArray(target);
  init();
});

targetInput.addEventListener('change', () => {
  pausePlay();
  target = parseInt(targetInput.value) || 7;
  arr    = generateArray(target);
  init();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
renderCode();
target = parseInt(targetInput.value) || 7;
arr    = generateArray(target);
init();
</script>
</body>
</html>
